# =====================================================================
# FasoCarbu - configuration commune
# Les valeurs sensibles viennent UNIQUEMENT de variables d'environnement
# (ou d'un fichier .env local, jamais commité). Voir .env.example.
# Profils : dev (par défaut) | prod
# =====================================================================
spring.application.name=fasocarbu
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:9090}

# ---------- Base de données (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fasocarbu_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ---------- JPA / Flyway ----------
# Le schéma est géré par Flyway (src/main/resources/db/migration).
# Hibernate se contente de vérifier que les entités correspondent.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Sécurité ----------
fasocarbu.jwtSecret=${JWT_SECRET}
fasocarbu.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
fasocarbu.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---------- Email (Brevo) ----------
brevo.api.key=${BREVO_API_KEY:}
brevo.url=https://api.brevo.com/v3/smtp/email

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:${java.io.tmpdir}/fasocarbu-uploads}

# ---------- Santé ----------
# Seul /actuator/health est exposé, sans détail (utilisé par l'hébergeur).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------- Encodage ----------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
