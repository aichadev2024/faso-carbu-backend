# Profil de production : toutes les variables sensibles sont obligatoires
# (DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, JWT_SECRET, BREVO_API_KEY, CORS_ALLOWED_ORIGINS)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

logging.level.root=INFO
logging.level.com.fasocarbu=INFO
logging.file.name=${LOG_FILE:}

# ---------- Petites instances (512 Mo, ex. offre gratuite Northflank) ----------
# Neon gratuit accepte peu de connexions : petit pool par défaut.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
# Neon met la base en veille : laisser le temps du réveil.
spring.datasource.hikari.connection-timeout=30000
server.tomcat.threads.max=${SERVER_THREADS:30}
server.shutdown=graceful
