# Environnement local complet : PostgreSQL + API.
#   docker compose up -d          -> base + API (profil dev, données de démo)
#   docker compose up -d postgres -> base seule (pour lancer l'API depuis l'IDE)
services:
  postgres:
    image: postgres:16-alpine
    container_name: fasocarbu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fasocarbu_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fasocarbu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fasocarbu-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fasocarbu_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSLMODE: disable
    ports:
      - "${SERVER_PORT:-9090}:9090"
    volumes:
      - uploads:/app/uploads

volumes:
  postgres_data:
  uploads:
